name: Release frontend

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Verify frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
        env:
          AGAPORNIS_FRONTEND_VERSION: ${{ github.ref_name }}
          AGAPORNIS_API_URL: http://127.0.0.1:3001/api

      - name: Package host-native source release
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output=dist/agapornis-frontend-source.tar.gz HEAD
          cd dist
          sha256sum agapornis-frontend-source.tar.gz > agapornis-frontend-source.tar.gz.sha256

      - name: Create release manifest
        run: node .github/scripts/create-release-manifest.cjs
        env:
          RELEASE_ARTIFACT: dist/agapornis-frontend-source.tar.gz
          RELEASE_MANIFEST: dist/release-manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agapornis-frontend-source.tar.gz
            dist/agapornis-frontend-source.tar.gz.sha256
            dist/release-manifest.json
            deploy/agapornis-frontend.service
